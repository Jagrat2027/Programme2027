  # ---- Réaffectations (Md€/an)
  - id: RA-AIDES
    type: reaffectation
    mesure: RA-AIDES
    basse: 90
    haute: 95
    perimetre_max: 95
    unite: md_an
    scenario: central
    statut_chiffrage: a_justifier
    note: >-
      Le rapport du Sénat (2023) chiffre 211 Md€ : 75 d'allègements de cotisations,
      88 de dépenses fiscales, 7 de subventions, 41 d'interventions Bpifrance
      (prêts et garanties, sans coût budgétaire équivalent). Périmètre budgétaire
      hors allègements : 95 Md€. Fourchette haute ramenée de 110 à 95 (plafond
      arithmétique). À ventiler dispositif par dispositif.
  # Groupe « allegements » : deux options qui s'excluent. Une seule peut
  # passer en scénario central ; le choix revient au programme.
  - id: RA-ALLEGEMENTS
    type: reaffectation
    mesure: RA-ALLEGEMENTS
