# Matrice de traçabilité — Programme2027 (France)
# Exigence (texte du programme) → mesure → ligne budgétaire.
# Vérifiée par tools/finance_check.py et la GitHub Action « traçabilité ».
#
# Conventions
# - Coûts des mesures : lus dans les tableaux des fichiers 01_…md à 14_…md
#   (cumul sur la période du pilier, en M€). Ne pas les recopier ici.
# - Lignes de recettes et de réaffectation : en Md€ PAR AN (flux annuels
#   en régime de croisière). Toute ligne doit déclarer son unité.
# - scenario : central (compté dans le solde), conditionnel (compté seulement
#   si sa condition est levée), rupture (contredit une exigence : jamais compté),
#   memoire (affiché pour information, hors solde).

version: 1

parametres:
  annee_reference: 2025
  pib_md: 2990            # déduit de déficit 152,5 Md€ = 5,1 % du PIB
  deficit_md: 152.5       # Insee, comptes 2025 publiés le 27/03/2026
  charge_interets_md: 64.7
  dette_md: 3460.5
  sources:
    - "https://www.journaldeleconomie.fr/deficit-dette-chiffres-insee/"
    - "https://www.publicsenat.fr/actualites/economie/211-milliards-deuros-daides-publiques-aux-entreprises-sur-quoi-repose-le-calcul-de-la-commission-denquete-du-senat"

periodes_piliers:        # années couvertes par le tableau de chaque pilier
  default: 4             # 2027–2030
  "01": 5                # 2027–2031

